<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Presently</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f4;--s:#fff;--ink:#14181f;--mut:#6b7280;--ln:#e4e6e9;--ac:#2f7d5b;--empty:#e8eaed;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1215;--s:#171b20;--ink:#eef0f2;--mut:#8b929c;--ln:#262b32;--ac:#4fbf8f;--empty:#252a31;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding:20px 20px 110px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0}
.date,.mut{color:var(--mut);margin:0}.date{font-size:14px}
.sum{margin:0 0 12px;font-size:14px}
.add{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:26px;line-height:1}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:14px 16px}
.chk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk.on:after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.nm{flex:1;min-width:0;font-weight:600;cursor:pointer}
.nm small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.stp{display:flex;align-items:center;gap:10px}
.stp button{width:34px;height:34px;border-radius:50%;background:var(--empty);font-size:20px}
.stp b{min-width:28px;text-align:center;font-weight:600}
.empty{text-align:center;padding:60px 10px}
.empty p:first-child{font-size:20px;font-weight:600;margin:0 0 6px}
.pri{background:var(--ink);color:var(--bg);border-radius:12px;padding:13px 22px;font-weight:600;margin-top:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;padding:16px 0;color:var(--mut);font-weight:600}
.tab.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--s);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--empty);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--s);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.nav button{width:40px;height:40px;font-size:20px;border-radius:50%}
.nav button:disabled{opacity:.25;cursor:default}
.nav b{font-weight:600}
.card{background:var(--s);border:1px solid var(--ln);border-radius:20px;padding:18px}
.stats{display:flex;gap:22px;margin-bottom:20px}
.stats div{font-size:13px;color:var(--mut)}
.stats strong{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em;color:var(--ink)}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.g7>b{font-size:11px;font-weight:500;color:var(--mut);text-align:center}
.gw{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}

.c{display:grid;place-items:center;aspect-ratio:1;border-radius:8px;font-style:normal;font-size:12px;color:var(--mut);background:color-mix(in srgb,var(--ac) calc(var(--r)*100%),var(--empty))}
.hm .c{border-radius:3px}
.c.hi{color:#fff}.c.f{opacity:.4}
.legend{margin:14px 0 0;font-size:12px;color:var(--mut);text-align:right}
.del{display:block;margin:22px auto 0;color:var(--mut);font-size:14px;padding:10px}

.card label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}

.card+.card{margin-top:12px}#hout{margin-top:18px}
.moods{display:flex;gap:8px}.moods button{flex:1;font-size:24px;padding:10px 0;border-radius:12px;background:var(--empty);filter:grayscale(.8);opacity:.7}.moods button.on{filter:none;opacity:1;box-shadow:inset 0 0 0 2px var(--ac)}

.stats.sm{flex-wrap:wrap;gap:16px}.stats.sm strong{font-size:24px}
.chart{width:100%;height:auto;display:block}.chart .ax{stroke:var(--ln);stroke-width:1}.chart .ln{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round}.chart .dot,.chart .bar{fill:var(--ac)}

.sec{margin:26px 0 12px}
.vi{width:86px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px;text-align:right}
.gi{width:68px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:3px 6px;margin:0 4px}
.gl{margin-top:4px}
.mf{display:flex;gap:2px}.mf button{font-size:20px;width:34px;height:36px;border-radius:10px;filter:grayscale(.8);opacity:.6}.mf button.on{filter:none;opacity:1;background:var(--empty)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.under{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.pill.over{background:color-mix(in srgb,#d64545 16%,transparent);color:#d64545}
.panel{max-height:92vh;overflow-y:auto}
.cam{flex:none;width:40px;height:40px;border-radius:50%;background:var(--empty);font-size:18px}
.fp{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.fl{list-style:none;margin:0 0 14px;padding:0}.fl li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}.fl small{display:block;color:var(--mut);font-size:12px}
.sh{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:6px 0 12px}.sh2{margin-top:36px}
.sc{margin-bottom:18px}.sc p{margin:4px 0 0}.sc .pri{margin-top:12px}
.panel .wg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.panel .wg input{width:90px;margin:0;text-align:right}
.wc{padding:16px}
.wh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.wh small{display:block;font-size:13px}
.ws{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.ws>button{width:48px;height:48px;border-radius:50%;background:var(--empty);font-size:24px}
.wc .wv{display:flex;align-items:baseline;gap:6px;margin:0}
.wc .wv input{width:110px;margin:0;font-size:34px;font-weight:700;text-align:center;border:0;border-bottom:2px solid var(--ln);border-radius:0;background:transparent;padding:4px 0;letter-spacing:-.02em}
.wc .wv span{color:var(--mut);font-size:16px}
.wc .wb{width:100%;margin-top:0}
.wd{margin:12px 0 0;text-align:center}
.wch{display:flex;gap:8px;overflow-x:auto;margin-top:12px}.wch span{flex:none;font-size:12px;color:var(--mut);background:var(--empty);border-radius:99px;padding:4px 10px}
.pill.due{background:var(--empty);color:var(--mut)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin:-4px 0 16px;padding:10px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s);font-size:13px;color:var(--mut);text-align:left}.mini b{color:var(--ink);font-weight:600}
.wc{padding:12px 14px}
.wh{margin-bottom:8px}.wh small{display:inline;font-size:12px;margin-left:6px;font-weight:400}
.ws{gap:8px;margin-bottom:0;justify-content:space-between}
.ws>button{width:36px;height:36px;font-size:20px;flex:none}
.wc .wv input{width:64px;font-size:22px;padding:2px 0}
.wc .wv span{font-size:13px}
.wc .wb{flex:1;width:auto;height:auto;padding:10px 12px;font-size:14px;margin:0;border-radius:10px;background:var(--ink)}
.wd{margin:8px 0 0;text-align:left}
.wch{margin-top:8px}
.wm{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}.wm b{color:var(--ink);font-size:14px}
.bt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0}.bt small{font-size:12px}
.bp{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff}
.bp.z0,.bb i.z0{background:#4a90d9}.bp.z1,.bb i.z1{background:#2f9e6b}.bp.z2,.bb i.z2{background:#d99a1e}.bp.z3,.bb i.z3{background:#d64545}.bp.z2{color:#2a1c00}
.bb{position:relative;display:flex;gap:2px;height:8px;margin-top:12px}.bb i{display:block;border-radius:4px;opacity:.85}
.bb em{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--s)}
.bl{position:relative;height:16px;font-size:11px;color:var(--mut);margin-top:6px}.bl span{position:absolute;transform:translateX(-50%)}
main{padding-bottom:40px}
.ins{margin-top:0}.ins+.chips{margin-top:22px}
.ir{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:12px 16px}.it{display:flex;justify-content:space-between;font-weight:600}.ir small{display:block;margin-top:6px;font-size:12px}
.st{display:flex;gap:3px;margin-top:8px}.st .c{flex:1;aspect-ratio:auto;height:10px;border-radius:3px;min-width:0}
.mn{flex:none;width:32px;height:32px;color:var(--mut);font-size:18px}
.pri.dg{background:#d64545;color:#fff}
main{padding-bottom:110px}
.tq .tr2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tq .tr2 input{width:auto;margin:0;flex:none;padding:8px 10px}
.pcs{display:flex;gap:6px}
.pc{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--empty);color:var(--mut)}
.pc:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.pc.high:before{background:#d64545}.pc.med:before{background:#d99a1e}.pc.low:before{background:#4a90d9}
.pc.on.high{background:#d64545;color:#fff}.pc.on.med{background:#d99a1e;color:#2a1c00}.pc.on.low{background:#4a90d9;color:#fff}.pc.on:before{background:currentColor}
.tq .pri{width:100%;margin-top:0}.tq .note{margin:10px 0 0}
.tk{border-left:4px solid var(--pc)}.tk.high{--pc:#d64545}.tk.med{--pc:#d99a1e}.tk.low{--pc:#4a90d9}
.tk.dn{opacity:.55}.tk.dn .tt{text-decoration:line-through}
.tm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-weight:400;font-size:12px;color:var(--mut)}
.pp{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.pp.high{background:#d64545}.pp.med{background:#d99a1e;color:#2a1c00}.pp.low{background:#4a90d9}
.du.od{color:#d64545;font-weight:600}.du.tdy{color:var(--ac);font-weight:600}
.tg{margin:22px 0 10px}.tg.od{color:#d64545}.lk{margin-left:8px;color:var(--ink);text-decoration:underline;font-size:13px}
.mini.warn{border-color:#d99a1e;color:var(--ink)}
.panel textarea{width:100%;font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;margin:10px 0}
.panel details{margin-top:16px;font-size:14px}.panel summary{cursor:pointer;color:var(--mut)}
.pri.alt{background:var(--empty);color:var(--ink)}
.panel .bk2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#bks{min-height:18px;margin:10px 0 0}
.fb{display:flex;align-items:center;gap:12px;margin-bottom:12px}.fb img{width:72px;height:72px;object-fit:cover;border-radius:12px;flex:none}.panel .fb .pri{width:auto;flex:1;margin:0}
.pri[disabled]{opacity:.6;cursor:default}
:root{--bg:#f0f4ea;--s:#fbfcf7;--ink:#263026;--mut:#66735f;--ln:#d8e0cf;--ac:#4a7655;--empty:#e1e8d8;--sa:#d8e7cf;--sb:#d8e7cf;--sc:#d8e7cf;--sd:#d8e7cf}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141813;--s:#1c211a;--ink:#e9eee5;--mut:#98a393;--ln:#2a3327;--ac:#86b890;--empty:#283024;--sa:#1f2a1f;--sb:#1f2a1f;--sc:#1f2a1f;--sd:#1f2a1f}}
:root[data-theme="dark"]{--bg:#141813;--s:#1c211a;--ink:#e9eee5;--mut:#98a393;--ln:#2a3327;--ac:#86b890;--empty:#283024;--sa:#1f2a1f;--sb:#1f2a1f;--sc:#1f2a1f;--sd:#1f2a1f}
.sx{border-radius:24px;padding:18px 16px 16px;margin:0 -6px 18px}
.s1{background:var(--sa)}.s2{background:var(--sb)}.s3{background:var(--sc)}.s4{background:var(--sd)}
.sx>header{margin-bottom:14px}.sx .sh2{margin-top:0}.sx>.tg:first-child,.sx>.sum:first-child{margin-top:0}
.sx .ins+.chips{margin-top:18px}
.today{font-size:15px;font-weight:600;margin:0 0 12px}.top{padding:14px 16px}.top .mini,.top .sc{margin:0}
#sheet[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--s);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.panel h2{margin:0 0 14px;font-size:20px}
.panel label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
.panel input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel .pri{width:100%;margin-top:4px}
</style></head>
<body>
<main id="app"></main>
<nav class="tabs"><button class="tab" data-act="tab" data-tab="today">Habits</button><button class="tab" data-act="tab" data-tab="todo">To-do</button></nav>

<div id="sheet" hidden></div>
<input type="file" id="foodcam" accept="image/*" capture="environment" hidden>
<input type="file" id="impf" accept=".json,application/json,text/plain" hidden>
<script>
const $=s=>document.querySelector(s);
let S={habits:[],logs:{}},V={tab:'today',sel:null,per:'week',off:0,arm:null,hm:'weight',hr:30,hd:0,isec:'habits'},F={};
try{const r=localStorage.getItem('daily-v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.health=S.health||{h:'',a:'',days:{}};S.todos=S.todos||[];
const save=()=>{try{localStorage.setItem('daily-v1',JSON.stringify(S))}catch(e){}};
if(!S.seeded){[['gym','Gym',2],['run','Run',0],['swim','Swim',0],['bike','Bike',0]].forEach(([id,name,t])=>{if(!S.habits.some(h=>h.name.toLowerCase()===name.toLowerCase()))S.habits.push({id,name,kind:'check',freq:'weekly',target:t,unit:'',step:1})});S.seeded=true;save()}
if(!S.seed2){S.habits.forEach(h=>{if(['gym','run','swim','bike'].includes(h.id))h.target=h.id==='gym'?2:0});S.seed2=true;save()}
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const mon=d=>addD(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const val=(h,d)=>(S.logs[h.id]||{})[key(d)]||0;
const isC=h=>h.kind==='count';
const dayR=(h,d)=>h.freq==='daily'?Math.min(1,val(h,d)/(isC(h)?h.target:1)):(val(h,d)>0?1:0);
const wkT=(h,m)=>{let t=0;for(let i=0;i<7;i++){const v=val(h,addD(m,i));t+=isC(h)?v:(v>0?1:0)}return Math.round(t*100)/100};
const wkR=(h,m)=>h.target>0?Math.min(1,wkT(h,m)/h.target):(wkT(h,m)>0?1:0);
const ok=(h,t)=>h.freq==='daily'?dayR(h,t)>=1:wkR(h,mon(t))>=1;

function streak(h){const t=today();let n=0;
  if(h.freq==='daily'){let d=t;if(dayR(h,d)<1)d=addD(d,-1);while(dayR(h,d)>=1&&n<4000){n++;d=addD(d,-1)}}
  else{let m=mon(t);if(wkR(h,m)<1)m=addD(m,-7);while(wkR(h,m)>=1&&n<600){n++;m=addD(m,-7)}}
  return n}

function viewToday(){
  const t=today(),hs=S.habits,done=hs.filter(h=>ok(h,t)).length;
  let o=`<section class="sx s1 top"><p class="today">${t.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p>${S.setupDone?setupMini():setupCard()}</section><section class="sx s1"><header><div><h1>Habits</h1></div><button class="add" data-act="new" aria-label="Add habit">+</button></header>${bkDue()?sunCard():''}`;
  if(!hs.length)return o+`<div class="empty"><p>Nothing tracked yet</p><p class="mut">Add a habit or metric to start building consistency.</p><button class="pri" data-act="new">Add a habit</button></div></section>`+bodyHTML()+viewInsights()+backupRow();
  o+=`<p class="mut sum">${done} of ${hs.length} done</p><ul class="list">`;
  hs.forEach(h=>{
    const v=val(h,t),u=h.unit?' '+esc(h.unit):'',m=mon(t),s=streak(h);
    let sub=h.freq==='daily'?(isC(h)?`${v} of ${h.target}${u} today`:(s?`${s}-day streak`:'Daily')):(h.target>0?(isC(h)?`${wkT(h,m)} of ${h.target}${u} this week`:`${wkT(h,m)} of ${h.target} this week`):`${wkT(h,m)}${u} this week · no goal`);
    const ctl=isC(h)?`<div class="stp"><button data-act="dec" data-id="${h.id}" aria-label="Decrease">−</button><b>${v}</b><button data-act="inc" data-id="${h.id}" aria-label="Increase">+</button></div>`:'';
    o+=`<li class="row">${isC(h)?'':`<button class="chk ${v?'on':''}" data-act="tog" data-id="${h.id}" aria-label="Mark ${esc(h.name)} done"></button>`}<div class="nm">${esc(h.name)}<small>${sub}</small></div>${ctl}<button class="mn" data-act="open" data-id="${h.id}" aria-label="Options for ${esc(h.name)}">⋯</button></li>`});
  return o+'</ul></section>'+bodyHTML()+viewInsights()+backupRow()}

function range(p,o){const t=today();let s,e,label;
  if(p==='week'){s=addD(mon(t),7*o);e=addD(s,6);label=fmt(s)+' – '+fmt(e)}
  else if(p==='month'){s=new Date(t.getFullYear(),t.getMonth()+o,1);e=new Date(s.getFullYear(),s.getMonth()+1,0);label=s.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
  else if(p==='quarter'){s=new Date(t.getFullYear(),(Math.floor(t.getMonth()/3)+o)*3,1);e=new Date(s.getFullYear(),s.getMonth()+3,0);label='Q'+(Math.floor(s.getMonth()/3)+1)+' '+s.getFullYear()}
  else{s=new Date(t.getFullYear()+o,0,1);e=new Date(s.getFullYear(),11,31);label=''+s.getFullYear()}
  return{s,e,label}}

function stats(h,r){const t=today();let done=0,tot=0;
  if(h.freq==='daily'){for(let d=r.s;d<=r.e&&d<=t;d=addD(d,1)){tot++;if(dayR(h,d)>=1)done++}}
  else{for(let m=mon(r.s);m<=r.e&&m<=t;m=addD(m,7)){const g=wkR(h,m)>=1;if(+m===+mon(t)&&!g)continue;tot++;if(g)done++}}
  return{done,tot,pct:tot?Math.round(done/tot*100)+'%':'–'}}

function visual(h,r,p){
  const t=today(),cell=(x,txt,fut,tt)=>`<i class="c${x>.55?' hi':''}${fut?' f':''}" style="--r:${x}" title="${tt||''}">${txt??''}</i>`;
  if(p==='week'||(p==='month'&&h.freq==='daily')){
    let c='';for(let i=0;i<(r.s.getDay()+6)%7;i++)c+='<i></i>';
    for(let d=r.s;d<=r.e;d=addD(d,1))c+=cell(dayR(h,d),d.getDate(),d>t,key(d));
    return`<div class="g7">${'MTWTFSS'.split('').map(x=>`<b>${x}</b>`).join('')}${c}</div>`}
  if(h.freq==='weekly'){
    let c='',n=0;for(let m=mon(r.s);m<=r.e;m=addD(m,7)){n++;c+=cell(wkR(h,m),p==='month'?wkT(h,m):'',m>t,'Week of '+fmt(m))}
    return`<div class="gw" style="--n:${p==='month'?n:13}">${c}</div><p class="legend">Each square is one week</p>`}
  let c='',n=0;const end=addD(mon(r.e),6);
  for(let d=mon(r.s);d<=end;d=addD(d,1)){if(d.getDay()===1)n++;c+=(d<r.s||d>r.e)?'<i class="c" style="visibility:hidden;--r:0"></i>':cell(dayR(h,d),'',d>t,key(d))}
  return`<div class="hm" style="--n:${n}">${c}</div><p class="legend">Each square is one day</p>`}

function strip(h,r,p){const t=today();let c='';const cell=(x,f)=>`<i class="c${x>.55?' hi':''}${f?' f':''}" style="--r:${x}"></i>`;
  if(p==='week'){for(let d=r.s;d<=r.e;d=addD(d,1))c+=cell(dayR(h,d),d>t)}
  else{for(let m=mon(r.s);m<=r.e;m=addD(m,7)){let x;if(h.freq==='weekly')x=wkR(h,m);else{let n=0;for(let i=0;i<7;i++)if(dayR(h,addD(m,i))>=1)n++;x=n/7}c+=cell(x,m>t)}}

function setVal(id,d,v){const l=S.logs[id]=S.logs[id]||{};if(v>0)l[key(d)]=v;else delete l[key(d)];save()}

  else if(a==='setup'){setupSheet();$('#sheet').hidden=false;return}
  else if(a==='ssave'){const H=S.health;H.dob=$('#sd').value||'';H.h=$('#sh').value.trim();H.goal=$('#sg').value.trim();document.querySelectorAll('[data-wg]').forEach(i=>{const x=S.habits.find(y=>y.id===i.dataset.wg);if(x){const v=i.value.trim();x.target=v===''?0:Math.max(0,+v||0)}});S.setupDone=true;save();$('#sheet').hidden=true}

const MOODS=['😞','🙁','😐','🙂','😄'],MN=['Rough','Low','Okay','Good','Great'];

function latestW(){const D=S.health.days,ks=Object.keys(D).filter(k=>D[k].wt).sort();return ks.length?D[ks[ks.length-1]].wt:0}
function bmiHTML(){const b=bmiOf(latestW()),a=ageOf();

function chart(pts,n,bar,top){
  const W=320,H=150,p=14;let lo=Math.min(...pts.map(x=>x.v)),hi=Math.max(...pts.map(x=>x.v));
  if(bar){lo=0;if(top)hi=top;hi=hi||1}else{const g=(hi-lo)||1;lo-=g*.25;hi+=g*.25}
  const X=i=>p+(n>1?i/(n-1):.5)*(W-2*p),Y=v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Trend chart"><line class="ax" x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}"/>`;
  if(bar){const bw=Math.max(2,(W-2*p)/n*.7);pts.forEach(q=>{s+=`<rect class="bar" x="${X(q.i)-bw/2}" y="${Y(q.v)}" width="${bw}" height="${H-p-Y(q.v)}" rx="${bw>6?3:1}"><title>${q.k}: ${q.v}</title></rect>`})}
  else{s+=`<polyline class="ln" points="${pts.map(q=>X(q.i)+','+Y(q.v)).join(' ')}"/>`;if(pts.length<=45)pts.forEach(q=>s+=`<circle class="dot" cx="${X(q.i)}" cy="${Y(q.v)}" r="3"><title>${q.k}: ${q.v.toFixed(1)}</title></circle>`)}
  return s+'</svg>'}
function trendsHTML(){
  const H=S.health,n=({week:7,month:30,quarter:90,year:365})[V.per]||30,m=V.hm,T={weight:'Weight (kg)',bmi:'BMI',cal:'Calories (kcal)',mood:'Mood (1 to 5)'};
  let o=`<div class="card"><p class="mut note" style="margin-bottom:12px">${T[m]}</p>`;
  if(m==='bmi'&&!(+H.h>0))return o+'<p class="mut">Add your height in setup to see BMI over time.</p></div>';
  const pts=[];for(let i=0;i<n;i++){const dd=addD(today(),i-n+1),x=ent(dd);const v=m==='weight'?x.wt:m==='bmi'?bmiOf(x.wt):m==='cal'?x.cal:x.mood;if(v>0)pts.push({i,v,k:key(dd)})}
  if(!pts.length)return o+'<p class="mut">No entries in this range yet. Log it under Health to start the chart.</p></div>';

function wkWeight(off){const m=addD(mon(today()),-7*off);for(let i=6;i>=0;i--){const d=addD(m,i),x=ent(d);if(x.wt)return{w:x.wt,k:key(d)}}return null}

const PW={high:3,med:2,low:1},PN={high:'High',med:'Medium',low:'Low'};
const dd=x=>Math.round((new Date(x.due+'T00:00:00')-today())/864e5);
function score(x){const d=x.due?dd(x):null;let s=PW[x.p]*10;if(d!==null)s+=d<0?40:d===0?30:d<=2?20:d<=7?10:0;return s}
function parseTodo(raw){
  let t=' '+raw+' ',p=null,due='';
  const cut=(re,fn)=>{t=t.replace(re,(...m)=>{fn(m);return ' '})};
  cut(/\s(!!!|!!|!high|!h|!med|!m|!low|!l)(?=\s)/i,m=>{const s=m[1].toLowerCase();p=(s==='!!!'||s==='!high'||s==='!h')?'high':(s==='!!'||s==='!med'||s==='!m')?'med':'low'});
  cut(/\s(today|tomorrow|tmrw|tmr)(?=[\s.,!?])/i,m=>{due=key(addD(today(),/^to(?!m)/i.test(m[1])?0:1))});
  cut(/\sin\s+(\d+)\s*(days?|d|weeks?|w)(?=[\s.,!?])/i,m=>{due=key(addD(today(),+m[1]*(/^w/i.test(m[2])?7:1)))});
  const W=['sun','mon','tue','wed','thu','fri','sat'];
  const wd=m=>{let n=(W.indexOf(m[1].toLowerCase().slice(0,3))-today().getDay()+7)%7;if(n===0)n=7;due=key(addD(today(),n))};
  cut(/\s(?:next\s+|on\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)(?=[\s.,!?])/i,wd);
  cut(/\s(?:next\s+|on\s+)(sun|mon|tue|wed|thu|fri|sat)(?=[\s.,!?])/i,wd);
  cut(/\s(sun|mon|tues?|wed|thu|thurs?|fri|sat)\s*$/i,wd);
  if(!p){if(/\b(urgent|asap|deadline|critical|important)\b/i.test(raw))p='high';else if(/\b(maybe|someday|sometime|eventually)\b/i.test(raw))p='low'}
  t=t.replace(/\s+/g,' ').trim()||raw;return{t:t.charAt(0).toUpperCase()+t.slice(1),p,due}}
function addTodo(){const el=$('#tn');if(!el)return;const raw=el.value.trim();if(!raw)return;
  const r=parseTodo(raw),dv=$('#td').value;

function dueInfo(x){if(!x.due)return null;const d=dd(x),dt=new Date(x.due+'T00:00:00');

function taskRow(x){const di=dueInfo(x),lg=x.done&&x.doneAt?'Done '+fmt(new Date(x.doneAt+'T00:00:00')):'Logged '+fmt(new Date(x.made+'T00:00:00'));

function viewTodo(){
  const t=today(),open=S.todos.filter(x=>!x.done),done=S.todos.filter(x=>x.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
